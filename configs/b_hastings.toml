# Schritt 4, Variante B: A plus korrekte Hastings-Korrektur der Taxa-Gewichte.
# Zur Konvergenz mit dem log-Gamma-Vorschlag gerechnet (gleiche Zielverteilung, s. b_hastings_dirichlet).
output_dir = "results/b_hastings"

[sampler]
# Voreinstellungen bis v2 festgeschrieben (seit v3: hierarchischer Prior, 8 Mio. It., CRU-Prior 50 km)
sample_length = 2000000
burn_in = 500000
thin = 150
taxa_prior = "fixed"
recent_temp_mean = 10.735555696487427
recent_temp_sd = 2.477961143339347
recent_pann_mean = 556.2477878146701
recent_pann_sd = 134.97964751751925
kernel = "corrected"
dirichlet_hastings_fix = true
weights_proposal = "log_gamma"
exact_gamma_moments = false

[postprocess]
quantile_method = "kde"
