# Vorlaeufiges lokales Referenzbeispiel: vorhandenes v2-Modell, thin=600 fuer begrenzten RAM.
# Keine taxonbasierte Multiproxy-Reproduktion und keine fachliche Freigabe.
data_dir = "data/in"
output_dir = "results/local_reference_v2"
plots = true
report = true

[sampler]
kernel = "corrected"
sample_length = 2000000
burn_in = 500000
thin = 600
n_chains = 4
seed = 2023
dirichlet_hastings_fix = true
exact_gamma_moments = true
dispersed_init = true
weights_proposal = "log_gamma"
target_accept = 0.234
taxa_prior = "fixed"
taxa_prior_alpha = 0.5
alpha_prior_median = 1.0
alpha_prior_log_sd = 1.0
dirichlet_spread_factor = 4.0
tf_bound_probs = [0.05, 0.95]
beta_shape1 = 3.0
beta_shape2 = 3.0
tf_normal_prior = false
recent_temp_mean = 10.735555696487427
recent_temp_sd = 2.477961143339347
recent_pann_mean = 556.2477878146701
recent_pann_sd = 134.97964751751925
ap_exclude_taxa = []
use_calibration = true
use_tf_likelihood = true
use_taxa_prior = true

[postprocess]
quantile_method = "samples"
reconstruction = "mean"
prior_reference = "model"
n_threads = 1
seed = 2023
