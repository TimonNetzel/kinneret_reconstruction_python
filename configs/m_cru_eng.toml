# Prior des rezenten Klimas: Gebietsmittel wie bisher, aber Sd als Unsicherheit des Klimas im
# Einzugsgebiet (1 degC, 20 %) statt raeumlicher Streuung der Gitterpunkte (2,48 degC, 135 mm)
output_dir = "results/m_cru_eng"

[sampler]
# Voreinstellungen bis v2 festgeschrieben (seit v3: hierarchischer Prior, 8 Mio. It., CRU-Prior 50 km)
