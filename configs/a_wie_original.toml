# Schritt 4, Variante A: ueberarbeiteter Sampler mit allen inhaltlichen Korrekturen AUS
# (Laenge, kappa, Gamma-Gitter, KDE-Quartile wie im Original). Muss statistisch mit dem
# Original uebereinstimmen und validiert damit den neuen Sampler.
output_dir = "results/a_wie_original"

[sampler]
# Voreinstellungen bis v2 festgeschrieben (seit v3: hierarchischer Prior, 8 Mio. It., CRU-Prior 50 km)
taxa_prior = "fixed"
recent_temp_mean = 10.735555696487427
recent_temp_sd = 2.477961143339347
recent_pann_mean = 556.2477878146701
recent_pann_sd = 134.97964751751925
kernel = "corrected"
n_chains = 4
sample_length = 1000000
burn_in = 250000
thin = 75
dirichlet_hastings_fix = false
weights_proposal = "dirichlet"
dirichlet_spread_factor = 1.0
exact_gamma_moments = false

[postprocess]
quantile_method = "kde"
