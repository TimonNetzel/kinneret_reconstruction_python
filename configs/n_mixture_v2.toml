# Standard v2 mit Rekonstruktion als Mischverteilung nach Gl. (3) (Pruefbericht 3.8). Gleiche Ketten wie
# standard_v2.toml; kinneret-recon batch wertet deren Ketten neu aus, statt neu zu sampeln.
output_dir = "results/n_mixture_v2"

[sampler]
# Voreinstellungen bis v2 festgeschrieben (seit v3: hierarchischer Prior, 8 Mio. It., CRU-Prior 50 km)
taxa_prior = "fixed"
recent_temp_mean = 10.735555696487427
recent_temp_sd = 2.477961143339347
recent_pann_mean = 556.2477878146701
recent_pann_sd = 134.97964751751925
kernel = "corrected"
n_chains = 4
sample_length = 2000000
burn_in = 500000
thin = 150
seed = 2023
dirichlet_hastings_fix = true
weights_proposal = "log_gamma"
exact_gamma_moments = true
tf_bound_probs = [0.05, 0.95]

[postprocess]
quantile_method = "samples"
reconstruction = "mixture"
