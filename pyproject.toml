[build-system]
requires = ["setuptools>=64", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "kinneret-recon"
version = "2.0.0.dev0"
description = "Bayessche Klimarekonstruktion aus Pollendaten des See Genezareth (Netzel et al., 2025)"
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [{name = "Timon Netzel"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
kinneret-recon = "kinneret_recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: lange Laeufe (vollstaendige Ketten); ausfuehren mit pytest -m slow"]
